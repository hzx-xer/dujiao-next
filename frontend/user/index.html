<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title></title>
  <!-- 首屏样式和脚本必须内联：外部 JS 下载完之前页面没有任何内容，这里先铺好主题背景，避免先白一下 -->
  <style>
    html[data-boot] { background-color: var(--boot-bg, #000000) !important; }
    html[data-boot] body, html[data-boot] #app { background-color: transparent !important; }
    .app-boot-spinner {
      position: fixed; top: 50%; left: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px;
      border: 3px solid rgba(128, 128, 128, .22); border-top-color: rgba(128, 128, 128, .75); border-radius: 50%;
      opacity: 0; animation: app-boot-spin .8s linear infinite, app-boot-show .2s ease-out .25s forwards;
    }
    @keyframes app-boot-spin { to { transform: rotate(360deg); } }
    @keyframes app-boot-show { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .app-boot-spinner { animation: app-boot-show .2s ease-out .25s forwards; } }
  </style>
  <script data-cfasync="false">
    (function () {
      var root = document.documentElement;
      var read = function (key) { try { return localStorage.getItem(key); } catch (e) { return null; } };
      // 主题优先级：用户手动选择 > 系统设置 > 默认黑夜。规则需与 src/utils/theme.ts 保持一致
      var theme = read('dujiao_theme_choice');
      if (theme !== 'dark' && theme !== 'light') {
        var prefersLight = false;
        try { prefersLight = matchMedia('(prefers-color-scheme: light)').matches; } catch (e) {}
        theme = prefersLight ? 'light' : 'dark';
      }
      if (theme === 'dark') root.classList.add('dark');
      root.style.colorScheme = theme;
      // 与各模板的页面底色保持一致；首次访问还不知道模板时用默认模板的颜色
      var colors = {
        classic: { light: '#f5f5f7', dark: '#000000' },
        vault: { light: '#f6f6fb', dark: '#15151f' },
        luna: { light: '#e3f1fc', dark: '#0f1826' }
      };
      var palette = colors[read('dj-storefront-template') || read('dj-storefront-template-last')] || colors.classic;
      var background = palette[theme];
      root.style.setProperty('--boot-bg', background);
      root.setAttribute('data-boot', '');
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', background);
    })();
  </script>
</head>

<body>
  <div id="app"><div class="app-boot-spinner" aria-hidden="true"></div></div>
  <script type="module" data-cfasync="false" src="/src/main.ts"></script>
</body>

</html>
